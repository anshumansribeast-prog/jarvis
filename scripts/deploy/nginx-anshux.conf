# Nginx site config for AnshuX at https://anshux.punah.pro
# Install:
#   sudo cp scripts/deploy/nginx-anshux.conf /etc/nginx/sites-available/anshux
#   sudo ln -sf /etc/nginx/sites-available/anshux /etc/nginx/sites-enabled/anshux
#   sudo certbot --nginx -d anshux.punah.pro
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name anshux.punah.pro;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name anshux.punah.pro;

    # Certbot will populate these paths:
    ssl_certificate     /etc/letsencrypt/live/anshux.punah.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anshux.punah.pro/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
