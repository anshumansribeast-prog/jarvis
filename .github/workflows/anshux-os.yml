name: AnshuX OS

on:
  push:
    paths:
      - "anshux_os/**"
      - "desktop/**"
      - "os_server.py"
      - "tests/test_anshux_os.py"
      - "requirements.txt"
      - ".github/workflows/anshux-os.yml"
  pull_request:
    paths:
      - "anshux_os/**"
      - "desktop/**"
      - "os_server.py"
      - "tests/test_anshux_os.py"
      - "requirements.txt"
      - ".github/workflows/anshux-os.yml"

jobs:
  smoke-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OS test dependencies
        run: python -m pip install flask pywin32 Pillow
      - name: Compile Python modules
        run: python -m compileall anshux_os os_server.py app_controller.py system_controller.py
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
