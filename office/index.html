<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANSHUX Command Office — COMMANDER + OpenCode</title>
  <style>
    :root {
      --bg:#07090d; --panel:#10161e; --ink:#dce8f0; --muted:#7a8c9a;
      --line:#1e2d3a; --amber:#e8b84a; --ok:#3dcc8a;
      --bad:#ff6b6b; --idle:#6b7c88; --work:#4aa3ff; --paper:#d6e4ee;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(1200px 600px at 80% -10%, #132033, var(--bg));
      color: var(--ink);
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .app { display: grid; grid-template-columns: 220px 1fr 280px; height: 100%; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .rail, .live { display: none; }
      .rail.open, .live.open { display: block; }
      .mob { display: inline-block !important; }
    }
    .rail, .live { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
    .live { border-right: 0; border-left: 1px solid var(--line); }
    .brand { padding: 16px 14px 8px; }
    .brand .k { font-size: .65rem; letter-spacing: .18em; color: var(--amber); text-transform: uppercase; }
    .brand h1 { margin: 4px 0 0; font-size: 1.05rem; font-weight: 700; }
    nav button, .ghost {
      display: block; width: calc(100% - 16px); margin: 4px 8px; text-align: left;
      background: transparent; color: var(--ink); border: 1px solid transparent;
      padding: 8px 10px; cursor: pointer; font: inherit;
    }
    nav button.active, nav button:hover { border-color: var(--line); background: #18222c; }
    .main { display: flex; flex-direction: column; min-height: 0; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--ok); }
    .dot.work { background: var(--work); } .dot.idle { background: var(--idle); } .dot.bad { background: var(--bad); } .dot.ok { background: var(--ok); }
    #view { flex: 1; overflow: auto; padding: 16px; }
    #cmd-log { display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 760px; padding: 12px 14px; border: 1px solid var(--line); background: #0c1218; }
    .msg.you { align-self: flex-end; border-color: #2a4a66; }
    .msg .who { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-bottom: 6px; }
    .cards { display: grid; gap: 8px; margin-top: 8px; }
    .card { border: 1px solid var(--line); padding: 8px; font-size: .85rem; background: #111a22; }
    .card .st { float: right; font-size: .7rem; letter-spacing: .1em; }
    .composer { display: none; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
    .composer.on { display: grid; }
    .assignbar {
      display: grid; grid-template-columns: 160px 1fr auto; gap: 8px; align-items: end;
      padding: 10px 16px; border-bottom: 1px solid var(--line); background: #0c141c;
    }
    @media (max-width: 800px) { .assignbar { grid-template-columns: 1fr; } }
    textarea, input, select {
      width: 100%; background: #0b1016; color: var(--ink); border: 1px solid var(--line);
      padding: 8px; font: inherit;
    }
    textarea { min-height: 64px; }
    button.primary { background: var(--amber); color: #111; border: 0; padding: 0 18px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #16324a; color: #fff; border: 1px solid #3d6b8a; padding: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; width: 100%; }
    .err { color: var(--bad); font-size: .85rem; min-height: 1.1em; padding: 0 16px; }
    pre, code { font-family: Consolas, monospace; }
    pre { background: #05080c; padding: 8px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; vertical-align: top; }
    .live h2, .floor h2 { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .row { padding: 6px 14px; font-size: .85rem; display: flex; justify-content: space-between; gap: 8px; }
    .hint { color: var(--muted); font-size: .8rem; padding: 0 14px 12px; }
    a { color: #8ec8ff; }
    .mob { display: none; }
    .loop { border: 1px dashed #3d6b8a; padding: 8px; font-size: .85rem; background: #12202a; }
    #others { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .desk { border: 1px solid var(--line); background: #111a22; padding: 8px; min-height: 90px; font-size: .8rem; }
    .desk.working { border-color: #3d6b8a; box-shadow: inset 0 0 0 1px #2a4a66; }
    .desk .name { font-weight: 700; }
    .desk .slice { color: var(--amber); font-size: .72rem; margin-top: 4px; letter-spacing: .04em; }
    .desk .task { margin-top: 6px; white-space: pre-wrap; color: var(--paper); }
    .briefing {
      border: 1px solid #3d6b8a; background: linear-gradient(120deg, #12202a, #0c141c);
      padding: 12px 12px 10px; margin-bottom: 12px;
    }
    .briefing h3 { margin: 0 0 6px; font-size: .95rem; }
    .briefing .meta { color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
    .architect { background: #18222c; border: 2px solid var(--amber); padding: 10px; margin: 10px 0; display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
    .stamp { border: 1px solid var(--amber); text-align: center; font-size: .65rem; padding: 6px; text-transform: uppercase; color: var(--amber); }
    #oc-log { height: 240px; overflow: auto; background: #07141c; padding: 10px; border: 1px solid #3d6b8a; font-family: Consolas, monospace; font-size: .85rem; }
    #oc-log .you { color: #9cf; margin: 0 0 8px; } #oc-log .opencode { color: #8dffb0; margin: 0 0 8px; }
    .ok { color: #8dffb0; } .bad { color: #ff9a9a; }
    label { display: block; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; margin: 8px 0 4px; }
    .split { display: grid; grid-template-columns: 1.2fr .8fr; gap: 12px; }
    @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="rail" id="rail">
      <div class="brand">
        <div class="k">ANSHUX · AI Command Office</div>
        <h1>COMMANDER</h1>
        <p class="hint" style="padding:8px 0 0">Hey AnshuX — the whole floor answers to you.</p>
      </div>
      <nav>
        <button type="button" data-view="chat" class="active">Commander + OpenCode</button>
        <button type="button" data-view="opencode">OpenCode log</button>
        <button type="button" data-view="floor">Office floor</button>
        <button type="button" id="new-chat">New Chat</button>
        <button type="button" data-view="conversations">Conversations</button>
        <button type="button" data-view="projects">Storage</button>
        <button type="button" data-view="agents">Agents</button>
        <button type="button" data-view="tasks">Tasks</button>
        <button type="button" data-view="activity">Activity</button>
        <button type="button" data-view="files">Files</button>
        <button type="button" data-view="settings">Settings</button>
      </nav>
      <p class="hint">Tell Commander to build a site. Everyone saves into Storage (`projects/…`). Open Storage to see PROGRESS.md and the site files.</p>
    </aside>
    <section class="main">
      <div class="bar">
        <div>
          <button class="ghost mob" type="button" id="toggle-nav">Menu</button>
          <b id="view-title">Commander chat</b>
        </div>
        <div><span class="dot"></span>COMMANDER online · OpenCode architect</div>
      </div>
      <form class="assignbar" id="assign-form">
        <div>
          <label for="seat">Assign like a real office</label>
          <select id="seat">
            <option value="everyone" selected>Everyone (whole floor)</option>
            <option value="opencode">OpenCode</option>
            <option value="cursor">Cursor</option>
            <option value="aider">Aider</option>
            <option value="continue">Continue</option>
            <option value="cline">Cline</option>
            <option value="ada">Ada</option>
            <option value="beast">Beast</option>
          </select>
        </div>
        <div>
          <label for="task">Floor goal</label>
          <input id="task" required placeholder="e.g. Build the demo-store site — every desk gets a slice">
        </div>
        <button class="primary" type="submit">Assign to whole office</button>
      </form>
      <p class="err" id="assign-err"></p>
      <div id="view"></div>
      <p class="err" id="err"></p>
      <form class="composer" id="cmd-form">
        <textarea id="cmd-msg" required placeholder="Chat here. Commander and OpenCode are one lead — everyone starts, Commander also does a slice."></textarea>
        <button class="primary" type="submit">Send to Commander + OpenCode</button>
      </form>
    </section>
    <aside class="live" id="live"></aside>
  </div>
  <script>
    const AGENTS = ["frontend","backend","debugger","testing","review","research","devops","security"];
    let state = { agents: [], tasks: [], conversations: [], activity: [], files: [], settings: {}, commander: {} };
    let office = { desks: [], sites: [], prs: [], chat: [], loop: "", updated: "" };
    let cid = null;
    let view = "chat";

    function esc(s) {
      return String(s || "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
    }
    function md(text) {
      let t = esc(text);
      t = t.replace(/```([\s\S]*?)```/g, (_, c) => "<pre><code>" + c + "</code></pre>");
      t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
      t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      t = t.replace(/^### (.*)$/gm, "<h3>$1</h3>");
      t = t.replace(/^## (.*)$/gm, "<h2>$1</h2>");
      t = t.replace(/^- (.*)$/gm, "<div>• $1</div>");
      return t.replace(/\n/g, "<br>");
    }
    function statusDot(st) {
      const s = String(st || "Idle").toLowerCase();
      const cls = s.includes("work") || s.includes("assign") || s === "running" ? "work"
        : (s.includes("fail") ? "bad" : (s.includes("ready") || s.includes("online") ? "ok" : "idle"));
      return `<span class="dot ${cls}"></span>`;
    }
    function agentStatusLine(a) {
      const st = a.status || "Idle";
      let detail = "";
      if (a.current_task) detail = ` · #${a.current_task}`;
      else if (a.last_task) detail = ` · last #${a.last_task} ${a.last_result || ""}`.trimEnd();
      return `${statusDot(st)}${esc(st)}${esc(detail)}`;
    }
    function convo() {
      return (state.conversations || []).find(c => c.id === cid) || { messages: [] };
    }
    function deskCard(d, architect) {
      const extra = architect ? `<div class="stamp">ARCH<br><b>OC</b></div>` : "";
      const working = String(d.status || "").toLowerCase().includes("work");
      const body = `<div>
        <div class="name">${esc(d.name)} ${working ? statusDot("work") : statusDot(d.status)}</div>
        <div>${esc(d.role)}</div>
        <div class="slice">YOU: ${esc(d.slice || "")}</div>
        <div class="task">${esc(d.task)}</div>
      </div>`;
      return `<article class="${architect ? "architect" : "desk"}${working ? " working" : ""}">${architect ? extra + body : body}</article>`;
    }
    function paintLive() {
      const agents = state.agents || [];
      const tasks = (state.tasks || []).slice(-6).reverse();
      const sites = office.sites || [];
      const brief = office.briefing || {};
      document.getElementById("live").innerHTML =
        `<h2>Live command center</h2>
         <div class="row"><span>Boss</span><span>${statusDot("Online")}${esc(office.boss || "AnshuX")}</span></div>
         <div class="row"><span>Commander</span><span>${statusDot("Online")}Online</span></div>
         <div class="row"><span>OpenCode</span><span>${statusDot("work")}Architect</span></div>
         <h2>Floor goal</h2>
         <div class="row"><span>${esc(brief.goal || "—")}</span><span>${esc(brief.seat || "")}</span></div>
         <h2>Floor desks</h2>` +
        (office.desks || []).map(d => `<div class="row"><span>${esc(d.name)}</span><span>${statusDot(d.status)}${esc(d.status || "idle")}</span></div>`).join("") +
         `<h2>Storage</h2>
         <div class="row"><span>${esc((state.storage||{}).path || "projects/…")}</span><span>${esc(((state.storage||{}).files||[]).length)} files</span></div>` +
        `<h2>Agents</h2>` +
        agents.map(a => `<div class="row"><span>${esc(a.name)}</span><span>${agentStatusLine(a)}</span></div>`).join("") +
        `<h2>Tasks</h2>` +
        (tasks.length ? tasks.map(t => `<div class="row"><span>#${esc(t.id)} ${esc(t.title)}</span><span>${esc(t.status)}</span></div>`).join("") : `<p class="hint">No Commander tasks yet.</p>`) +
        `<h2>Sites</h2>` +
        sites.map(s => `<div class="row"><span>${esc(s.name)}</span><span class="${String(s.code)==="200"?"ok":"bad"}">${esc(s.code)}</span></div>`).join("");
    }
    function renderChat() {
      const msgs = convo().messages || [];
      const html = msgs.map(m => {
        const who = m.role === "user" ? "you" : "commander";
        let extra = "";
        if (m.tasks && m.tasks.length) {
          extra = `<div class="cards">` + m.tasks.map(t =>
            `<div class="card"><span class="st">${esc(t.status)}</span><b>#${esc(t.id)} ${esc(t.title)}</b><div>${esc(t.agent)} · deps ${esc((t.depends||[]).join(", ")||"none")}</div></div>`
          ).join("") + `</div>`;
        }
        if (m.needs_approval) extra += `<div class="card">Approval required before destructive work runs.</div>`;
        return `<article class="msg ${who}"><div class="who">${esc(who)}</div><div>${md(m.text || "")}</div>${extra}</article>`;
      }).join("");
      document.getElementById("view").innerHTML = `<div id="cmd-log">${html || "<p class='hint'>Hey AnshuX — COMMANDER + OpenCode are ready. Send once and everyone greets you and starts.</p>"}</div>`;
    }
    function renderOpenCode() {
      const chat = office.chat || [];
      const log = chat.length
        ? chat.map(m => `<div class="${esc(m.who)}"><strong>${esc(m.who)}</strong> ${esc(m.t || "")}<br>${esc(m.text)}</div>`).join("")
        : `<div class="opencode"><strong>opencode</strong><br>Architect online. Type below. Every loop member must have a desk and a task.</div>`;
      document.getElementById("view").innerHTML = `
        <div>
          <h2>OpenCode chat panel</h2>
          <div id="oc-log">${log}</div>
          <p class="err" id="chat-err"></p>
          <form id="oc-form">
            <label for="oc-msg">Message to OpenCode</label>
            <textarea id="oc-msg" required placeholder="Inspect both sites and assign tasks to Aider and Ada"></textarea>
            <button class="secondary" type="submit">Send to OpenCode</button>
          </form>
          <p class="hint">Use the Assign a task bar at the top. Default is Everyone so nobody sits idle.</p>
        </div>`;
      fillSeats();
      const el = document.getElementById("oc-log");
      if (el) el.scrollTop = el.scrollHeight;
    }
    function fillSeats() {
      const seat = document.getElementById("seat");
      if (!seat) return;
      const desks = office.desks || [];
      const cur = seat.value || "everyone";
      const opts = [{id:"everyone", name:"Everyone (whole floor)"}].concat(
        desks.length ? desks : [
          {id:"opencode",name:"OpenCode"},{id:"cursor",name:"Cursor"},{id:"aider",name:"Aider"},
          {id:"continue",name:"Continue"},{id:"cline",name:"Cline"},{id:"ada",name:"Ada"},{id:"beast",name:"Beast"}
        ]
      );
      seat.innerHTML = opts.map(d => `<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("");
      seat.value = opts.some(d => d.id === cur) ? cur : "everyone";
    }
    function renderFloor() {
      const desks = office.desks || [];
      const arch = desks.find(d => d.id === "opencode");
      const brief = office.briefing || {};
      const greetings = (office.greetings || []).slice(0, 8).map(g =>
        `<div class="card"><b>${esc(g.who)}</b><br>${esc(g.text)}</div>`
      ).join("");
      const briefingHtml = brief.goal ? `
        <div class="briefing">
          <h3>Hey AnshuX — floor briefing</h3>
          <div class="meta">${esc(brief.at || "")} · assigned to <b>${esc(brief.seat || "everyone")}</b> · ${esc((brief.targets || []).length || desks.length)} desks</div>
          <div><b>Goal:</b> ${esc(brief.goal)}</div>
          <p class="hint" style="padding:8px 0 0">Every desk greets you and takes a slice. Commander agents save into Storage.</p>
        </div>` : `<div class="briefing"><h3>Hey AnshuX — floor ready</h3><p class="meta">Use <b>Assign to whole office</b> so nobody sits idle.</p></div>`;
      document.getElementById("view").innerHTML = `
        ${briefingHtml}
        <h2>Greetings for AnshuX</h2>
        <div class="cards">${greetings || "<p class='hint'>Loading…</p>"}</div>
        <p class="loop" id="loop">${esc(office.loop || "LOOP: OpenCode, Cursor, Aider, Continue, Cline, Ada, Beast — all must sit here with a task.")}</p>
        <p class="hint" id="when">${esc(office.updated || "")} · idle desks: ${esc((office.idle || []).join(", ") || "none")}</p>
        <h2>Architect’s table</h2>
        <div id="arch-desk">${arch ? deskCard(arch, true) : ""}</div>
        <h2>Every loop member</h2>
        <div id="others">${desks.filter(d => d.id !== "opencode").map(d => deskCard(d, false)).join("")}</div>
        <div class="split" style="margin-top:16px">
          <section id="sites"><h3>Sites</h3>${(office.sites||[]).map(s =>
            `<div><span class="${String(s.code)==="200"?"ok":"bad"}">${esc(s.code)}</span> ${esc(s.name)}<br><a href="${esc(s.url)}">${esc(s.url)}</a></div>`
          ).join("")}</section>
          <section id="prs"><h3>PRs</h3>${(office.prs||[]).map(p =>
            `<div>#${esc(p.number)} ${esc(p.repo)} — ${esc(p.title)}</div>`
          ).join("")}</section>
        </div>`;
    }
    function renderAgents() {
      document.getElementById("view").innerHTML = `<table><tr><th>Agent</th><th>Role</th><th>Status</th><th>Task</th><th>Logs</th></tr>` +
        (state.agents || []).map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.role)}<br><small>${esc((a.capabilities||[]).join(", "))}</small></td><td>${esc(a.status)}${a.last_task ? ` · last #${esc(a.last_task)} ${esc(a.last_result||"")}` : ""}</td><td>${esc(a.current_task || "—")}</td><td><pre>${esc(JSON.stringify((a.logs||[]).slice(-4), null, 0))}</pre></td></tr>`).join("") + `</table>`;
    }
    function renderTasks() {
      const rows = (state.tasks || []).slice().reverse();
      document.getElementById("view").innerHTML = `<table><tr><th>ID</th><th>Title</th><th>Agent</th><th>Status</th><th>Deps</th><th>Actions</th></tr>` +
        rows.map(t => `<tr>
          <td>#${esc(t.id)}</td><td>${esc(t.title)}<br><small>${esc((t.output||t.errors||"").slice(0,180))}</small></td>
          <td><select data-reassign="${esc(t.id)}">${AGENTS.map(id => `<option ${id===t.agent?"selected":""} value="${id}">${id}</option>`).join("")}</select></td>
          <td>${esc(t.status)} ${esc(t.progress||0)}%</td>
          <td>${esc((t.depends||[]).join(", "))}</td>
          <td>
            <button type="button" data-act="retry" data-id="${esc(t.id)}">Retry</button>
            <button type="button" data-act="cancel" data-id="${esc(t.id)}">Stop</button>
            ${t.status==="NEEDS_REVIEW"?`<button type="button" data-act="approve" data-id="${esc(t.id)}">Approve</button>`:""}
          </td></tr>`).join("") + `</table>`;
    }
    function renderList(title, items) {
      document.getElementById("view").innerHTML = `<h3>${esc(title)}</h3>` + (items.join("") || "<p class='hint'>Nothing yet.</p>");
    }
    function paintView() {
      document.getElementById("cmd-form").classList.toggle("on", view === "chat");
      document.querySelectorAll("nav [data-view]").forEach(b => b.classList.toggle("active", b.dataset.view === view));
      const titles = {
        chat: "Commander + OpenCode", opencode: "OpenCode log", floor: "Office floor",
        conversations: "Conversations", projects: "Storage", agents: "Agents",
        tasks: "Tasks", activity: "Activity", files: "Files", settings: "Settings"
      };
      document.getElementById("view-title").textContent = titles[view] || view;
      if (view === "chat") renderChat();
      else if (view === "opencode") renderOpenCode();
      else if (view === "floor") renderFloor();
      else if (view === "agents") renderAgents();
      else if (view === "tasks") renderTasks();
      else if (view === "conversations") renderList("Conversations", (state.conversations||[]).map(c => `<div class="card"><button type="button" data-open="${esc(c.id)}">${esc(c.title)}</button> ${esc(c.created)}</div>`));
      else if (view === "projects") renderStorage();
      else if (view === "activity") renderList("Activity", (state.activity||[]).slice().reverse().map(a => `<div class="card">${esc(a.t)} — ${esc(a.text)}</div>`));
      else if (view === "files") renderList("Workspace files", (state.files||[]).map(f => `<div class="card"><button type="button" data-file="${esc(f.path)}">${esc(f.path)}</button> ${esc(f.bytes)} bytes</div>`));
      else if (view === "settings") document.getElementById("view").innerHTML =
        `<div class="card"><p>Server model (COMMANDER_MODEL env): <code>${esc((state.settings||{}).model)}</code></p>
         <label>Active storage project id</label><input id="proj" value="${esc((state.settings||{}).project||"anshux")}">
         <p class="hint">Folder: command_office/workspace/projects/&lt;id&gt;/ — everyone saves progress here.</p>
         <button type="button" class="primary" id="save-set">Save project</button></div>`;
      paintLive();
      fillSeats();
    }
    function renderStorage() {
      const s = state.storage || {};
      const files = (s.files || []).map(f =>
        `<div class="card"><button type="button" data-file="${esc(f.path)}">${esc(f.path)}</button> ${esc(f.bytes)} bytes</div>`
      );
      const projects = (s.projects || []).map(p =>
        `<div class="card">${p.active ? "<b>ACTIVE · </b>" : ""}${esc(p.slug)} · ${esc(p.files)} files · <code>${esc(p.path)}</code></div>`
      );
      document.getElementById("view").innerHTML = `
        <div class="card">
          <h3>Shared site storage</h3>
          <p>Everyone (COMMANDER, agents, desks) writes progress into one folder:</p>
          <p><code>command_office/workspace/${esc(s.path || "projects/…")}/</code></p>
          <p><a href="/api/command/site?project=${encodeURIComponent(s.slug || "")}" target="_blank" rel="noopener">Open site preview</a>
             · progress file <code>${esc(s.progress || "PROGRESS.md")}</code></p>
        </div>
        <h3>Projects</h3>${projects.join("") || "<p class='hint'>No projects yet — chat “build a website called my-site”.</p>"}
        <h3>PROGRESS.md</h3><pre>${esc(s.progress_text || "(empty)")}</pre>
        <h3>Files in this project</h3>${files.join("") || "<p class='hint'>No files yet.</p>"}`;
    }
    async function loadCommand() {
      const r = await fetch("/api/command?t=" + Date.now());
      if (!r.ok) throw new Error("command api " + r.status);
      state = await r.json();
      if (!cid && state.conversations && state.conversations.length) cid = state.conversations[state.conversations.length - 1].id;
    }
    async function loadOffice() {
      const r = await fetch("/api/office?t=" + Date.now());
      if (!r.ok) throw new Error("office api " + r.status);
      office = await r.json();
    }
    async function loadAll() {
      const err = document.getElementById("err");
      try {
        await Promise.all([loadCommand(), loadOffice()]);
        err.textContent = "";
        const typing = document.activeElement && ["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName);
        fillSeats();
        paintLive();
        if (!typing) paintView();
      } catch (e) {
        err.textContent = "Keep python team.py office running. Chat APIs are on this same page.";
      }
    }
    async function post(url, body) {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      return data;
    }
    document.querySelector("nav").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-view]");
      if (b) { view = b.dataset.view; paintView(); }
    });
    document.getElementById("new-chat").addEventListener("click", async () => {
      const data = await post("/api/command/conversation", {});
      state = data.state; cid = data.conversation.id; view = "chat"; paintView();
    });
    document.getElementById("cmd-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const text = document.getElementById("cmd-msg").value.trim();
      if (!text) return;
      document.getElementById("cmd-msg").value = "";
      document.getElementById("err").textContent = "Commander planning…";
      try {
        const data = await post("/api/command/chat", { text, conversation_id: cid });
        cid = data.conversation_id;
        state = data.state;
        if (data.office) office = data.office;
        view = "chat";
        document.getElementById("err").textContent = "";
        paintView();
      } catch (e) {
        document.getElementById("err").textContent = String(e);
      }
    });
    document.getElementById("assign-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const seat = document.getElementById("seat").value;
      const task = document.getElementById("task").value.trim();
      if (!task) return;
      document.getElementById("assign-err").textContent =
        seat === "everyone" ? "Briefing the whole office…" : "Assigning desk…";
      try {
        const data = await post("/api/assign", { seat, task });
        if (data.office) office = data.office;
        if (data.command) state = { ...state, ...data.command };
        if (data.storage && data.storage.path) state.storage = data.storage;
        document.getElementById("task").value = "";
        const n = (office.desks || []).length;
        const created = (data.created || []).length;
        document.getElementById("assign-err").textContent = "";
        document.getElementById("err").textContent =
          `Office briefed: ${n} desks working` + (created ? ` · ${created} Commander tasks queued` : "");
        view = "floor";
        paintView();
        await loadCommand();
        paintView();
      } catch (e) {
        document.getElementById("assign-err").textContent = String(e);
      }
    });
    document.getElementById("view").addEventListener("submit", async (ev) => {
      const oc = ev.target.closest("#oc-form");
      if (!oc) return;
      ev.preventDefault();
      try {
        const text = document.getElementById("oc-msg").value.trim();
        if (!text) return;
        document.getElementById("oc-msg").value = "";
        document.getElementById("chat-err").textContent = "Sending to OpenCode…";
        const data = await post("/api/chat", { text });
        if (data.office) office = data.office;
        document.getElementById("chat-err").textContent = "";
        paintView();
      } catch (e) {
        const slot = document.getElementById("chat-err");
        if (slot) slot.textContent = String(e);
      }
    });
    document.getElementById("view").addEventListener("click", async (ev) => {
      const act = ev.target.closest("[data-act]");
      const open = ev.target.closest("[data-open]");
      const file = ev.target.closest("[data-file]");
      const save = ev.target.closest("#save-set");
      try {
        if (act) {
          const id = Number(act.dataset.id);
          if (act.dataset.act === "cancel" && !confirm("Stop task #" + id + "?")) return;
          const url = { retry: "/api/command/retry", cancel: "/api/command/cancel", approve: "/api/command/approve" }[act.dataset.act];
          state = (await post(url, { id })).state;
          paintView();
        }
        if (open) { cid = open.dataset.open; view = "chat"; paintView(); }
        if (file) {
          const data = await (await fetch("/api/command/file?path=" + encodeURIComponent(file.dataset.file))).json();
          document.getElementById("view").innerHTML = `<h3>${esc(data.path)}</h3><pre>${esc(data.text)}</pre>`;
        }
        if (save) {
          state.settings = (await post("/api/command/settings", { project: document.getElementById("proj").value })).settings;
          paintView();
        }
      } catch (e) {
        document.getElementById("err").textContent = String(e);
      }
    });
    document.getElementById("view").addEventListener("change", async (ev) => {
      const sel = ev.target.closest("[data-reassign]");
      if (!sel) return;
      try {
        state = (await post("/api/command/reassign", { id: Number(sel.dataset.reassign), agent: sel.value })).state;
        paintView();
      } catch (e) {
        document.getElementById("err").textContent = String(e);
      }
    });
    document.getElementById("toggle-nav").addEventListener("click", () => document.getElementById("rail").classList.toggle("open"));
    loadAll();
    setInterval(loadAll, 8000);
  </script>
</body>
</html>
