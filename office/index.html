<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ANSHUX — Architect’s office</title>
  <style>
    :root { --line:#3d6b8a; --paper:#d6e4ee; --ink:#16324a; --ok:#1b6b3a; --bad:#a33; --idle:#667; }
    * { box-sizing: border-box; }
    body { margin:0; background:#8aa4b5; color:var(--ink); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .sheet {
      margin:16px auto; max-width:1100px; background:
        linear-gradient(transparent 23px, rgba(61,107,138,.18) 24px),
        linear-gradient(90deg, transparent 23px, rgba(61,107,138,.18) 24px),
        var(--paper);
      background-size:24px 24px; border:3px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,.2);
    }
    .titleblock { display:grid; grid-template-columns: 1fr 220px 160px; border-bottom:3px solid var(--line); }
    .titleblock div { padding:10px 14px; border-left:2px solid var(--line); }
    .titleblock div:first-child { border-left:0; }
    .k { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; opacity:.7; }
    .v { font-size:1.15rem; font-weight:700; }
    .plan { display:grid; grid-template-columns: 1fr 280px; }
    @media (max-width: 860px) { .titleblock, .plan { grid-template-columns: 1fr; } }
    .floor { padding:16px 18px 22px; }
    .north { float:right; font-size:.7rem; border:1px solid var(--line); padding:4px 8px; }
    h2 { margin:0 0 10px; font-size:.95rem; letter-spacing:.08em; text-transform:uppercase; }
    .architect {
      clear:both; background:#fff; border:3px solid var(--ink); padding:14px 16px; margin-bottom:14px;
      display:grid; grid-template-columns: 88px 1fr; gap:12px; align-items:start;
    }
    .stamp { border:2px solid var(--ink); text-align:center; padding:8px 4px; font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; }
    .stamp b { display:block; font-size:1.1rem; letter-spacing:.02em; margin-top:4px; }
    #others { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap:10px; }
    .desk { border:1px solid var(--line); background:rgba(255,255,255,.72); padding:10px; min-height:110px; }
    .desk .name { font-weight:700; }
    .desk .role { font-size:.78rem; margin:.2rem 0 .4rem; }
    .desk .task { font-size:.75rem; line-height:1.35; }
    .badge { font-size:.65rem; letter-spacing:.08em; }
    .on .badge { color:var(--ok); } .idle .badge { color:var(--idle); } .off .badge { color:var(--bad); }
    .wall { border-left:3px solid var(--line); background:rgba(22,50,74,.92); color:#d7ecf7; font-family: ui-monospace, Consolas, monospace; font-size:.75rem; padding:12px; }
    .wall h3 { margin:0 0 8px; font-family: inherit; color:#fff; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; }
    .wall a { color:#9cf; } .ok { color:#8dffb0; } .bad { color:#ff9a9a; }
    .wall section { margin-bottom:16px; }
    footer { border-top:3px solid var(--line); padding:8px 14px; font-size:.75rem; }
  </style>
</head>
<body>
  <div class="sheet">
    <header class="titleblock">
      <div>
        <div class="k">Project</div>
        <div class="v">ANSHUX office — drawing A1</div>
        <div>Floor plan. Architect assigns desks. No idle seats.</div>
      </div>
      <div>
        <div class="k">Architect of the office</div>
        <div class="v" id="arch-name">OpenCode</div>
        <div id="when">…</div>
      </div>
      <div>
        <div class="k">Sheet</div>
        <div class="v">A1 / LOOP</div>
        <div>python team.py office</div>
      </div>
    </header>
    <div class="plan">
      <div class="floor">
        <div class="north">N ↑</div>
        <h2>Architect’s table</h2>
        <div id="arch-desk"></div>
        <h2>Drafting room</h2>
        <div id="others"></div>
      </div>
      <aside class="wall">
        <section id="sites"></section>
        <section id="prs"></section>
      </aside>
    </div>
    <footer>OpenCode is architect: layout, both sites, both PRs. Cursor checks the drawing. Aider builds.</footer>
  </div>
  <script>
    const fallback = {
      updated: "run python team.py office",
      architect: "OpenCode",
      desks: [
        { id:"opencode", name:"OpenCode", role:"Architect of the office", task:"Assign desks; inspect Semicolon + Cosmos live and PRs", status:"idle" },
        { id:"cursor", name:"Cursor", role:"Checker", task:"Verify the drawing + pytest", status:"on" },
        { id:"aider", name:"Aider", role:"Builder", task:"Restore Ada API on PR #8", status:"idle" },
        { id:"continue", name:"Continue", role:"Editor", task:"anshux.code-workspace", status:"idle" },
        { id:"ada", name:"Ada", role:"Semicolon tutor", task:"ada.html", status:"idle" },
        { id:"beast", name:"Beast", role:"Cosmos tutor", task:"cosmos.punah.pro", status:"idle" }
      ],
      sites: [], prs: []
    };
    function card(d, architect) {
      const klass = d.id === "opencode" ? "architect" : "desk";
      const extra = architect ? `<div class="stamp">Registered<br><b>ARCH</b><br>OpenCode</div>` : "";
      const body = `<div>
        <span class="badge">${(d.status||"idle").toUpperCase()}</span>
        <div class="name">${d.name}</div>
        <div class="role">${d.role}</div>
        <div class="task">${d.task}</div>
      </div>`;
      return `<article class="${klass} ${d.status||"idle"}">${architect ? extra + body : body}</article>`;
    }
    function paint(data) {
      document.getElementById("when").textContent = data.updated || "";
      document.getElementById("arch-name").textContent = data.architect || "OpenCode";
      const desks = data.desks || [];
      const arch = desks.find(d => d.id === "opencode") || desks[0];
      const rest = desks.filter(d => d.id !== "opencode");
      document.getElementById("arch-desk").innerHTML = arch ? card(arch, true) : "";
      document.getElementById("others").innerHTML = rest.map(d => card(d, false)).join("");
      document.getElementById("sites").innerHTML = "<h3>Site elevations</h3>" + (data.sites||[]).map(s =>
        `<div><span class="${String(s.code)==="200"?"ok":"bad"}">${s.code}</span> ${s.name}<br><a href="${s.url}">${s.url}</a></div>`
      ).join("") || "<div>No pings</div>";
      document.getElementById("prs").innerHTML = "<h3>PR sheets (architect reviews)</h3>" + (data.prs||[]).map(p =>
        `<div>#${p.number} ${p.repo}<br>${p.title}<br><a href="${p.url||"#"}">${p.url||""}</a> (${p.state})</div>`
      ).join("") || "<div>No PRs listed</div>";
    }
    async function load() {
      try {
        const r = await fetch("state.json?t=" + Date.now());
        if (!r.ok) throw new Error("no json");
        paint(await r.json());
      } catch { paint(fallback); }
    }
    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
